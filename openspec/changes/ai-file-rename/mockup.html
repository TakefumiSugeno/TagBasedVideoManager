<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TagBasedVideoManager Companion - UI/UX Mockup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              fluent: {
                bg: "#1e1e1e",
                surface: "#252526",
                card: "#2d2d30",
                border: "#3e3e42",
                accent: "#0078d4",
                accentHover: "#1084d8",
                text: "#ffffff",
                subtext: "#969696",
                danger: "#f14c4c",
                warning: "#cca700",
                success: "#89d185",
              },
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #444444;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555555;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-fluent-text font-sans p-2 sm:p-6 flex justify-center items-center min-h-screen antialiased select-none"
    x-data="companionApp()"
  >
    <!-- Desktop App Window (Windows 11 Fluent) -->
    <div
      class="w-full max-w-6xl bg-fluent-bg border border-fluent-border rounded-xl shadow-2xl overflow-hidden flex flex-col h-[94vh] max-h-[920px]"
    >
      <!-- Titlebar -->
      <div
        class="bg-fluent-surface border-b border-fluent-border px-4 py-2 flex items-center justify-between flex-shrink-0"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-5 h-5 rounded bg-blue-600 flex items-center justify-center text-[10px] font-bold shadow text-white"
          >
            ▶
          </div>
          <span class="text-xs font-semibold text-fluent-text tracking-wide"
            >TagBasedVideoManager - Desktop Companion</span
          >
          <span
            class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded border border-zinc-700"
            >100% F# Avalonia.FuncUI</span
          >
        </div>
        <div class="flex items-center space-x-3 text-fluent-subtext text-xs">
          <button class="hover:text-white px-2 py-1">─</button>
          <button class="hover:text-white px-2 py-1">□</button>
          <button class="hover:text-fluent-danger px-2 py-1 font-bold">
            ✕
          </button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="flex-1 flex flex-col overflow-hidden p-4 space-y-3">
        <!-- SECTION 1: Docker Status Controller -->
        <div
          class="bg-fluent-surface border border-fluent-border rounded-lg p-3 flex flex-wrap items-center justify-between gap-3 shadow-sm flex-shrink-0"
        >
          <div class="flex items-center space-x-4">
            <div
              class="text-xs font-semibold uppercase tracking-wider text-fluent-subtext flex items-center gap-1.5"
            >
              <svg
                class="w-4 h-4 text-blue-400"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.186.185.186m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.186.185.186m-2.953 2.714h2.118a.186.186 0 00.186-.185V9.006a.185.185 0 00-.186-.186H8.076a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m0-2.714h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185H8.076a.185.185 0 00-.185.185v1.887c0 .102.083.186.185.186m-2.955 5.428h2.119a.186.186 0 00.185-.185V11.72a.186.186 0 00-.185-.186H5.121a.186.186 0 00-.185.186v1.887c0 .103.083.185.185.185m0-2.714h2.119a.186.186 0 00.185-.186V9.006a.185.185 0 00-.185-.186H5.121a.186.186 0 00-.185.185v1.888c0 .102.083.185.185.185m0-2.714h2.119a.186.186 0 00.185-.186V6.29a.186.186 0 00-.185-.185H5.121a.186.186 0 00-.185.185v1.887c0 .102.083.186.185.186m16.598 4.298c-.147-.323-.396-.582-.71-.741a4.954 4.954 0 00-1.685-.436H16.32a.186.186 0 00-.186.185v1.888c0 .102.083.185.186.185h2.47c.075 0 .144.027.198.077.062.058.093.136.086.22-.051.61-.413 1.139-.99 1.44-.45.234-.97.357-1.492.357H3.454c-.663 0-1.287-.272-1.743-.761A2.528 2.528 0 011 15.632c0-.704.281-1.365.776-1.859.458-.458 1.066-.723 1.706-.745.18-.006.326-.153.326-.334v-.486c0-.986.386-1.914 1.085-2.614.7-.7 1.628-1.085 2.614-1.085.183 0 .332-.146.332-.33v-.486c0-.986.386-1.913 1.086-2.613A3.705 3.705 0 0111.538 4c.987 0 1.914.385 2.614 1.084.7.7 1.085 1.627 1.085 2.613v.486c0 .184.148.33.332.33.986 0 1.914.386 2.613 1.086.7.7 1.086 1.627 1.086 2.613v.486c0 .18.146.328.326.334.64.022 1.248.287 1.706.745.495.494.776 1.155.776 1.859a2.534 2.534 0 01-.71 1.794c-.456.489-1.08.761-1.743.761H17.84a.185.185 0 01-.186-.185v-1.888a.186.186 0 01.186-.185h2.47c.522 0 1.042-.123 1.492-.357.577-.301.939-.83 1.012-1.44a.186.186 0 00-.095-.19z"
                />
              </svg>
              Docker Container
            </div>

            <!-- Dynamic Status Badge -->
            <div
              class="flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-semibold border"
              :class="{
                 'bg-emerald-950/80 text-emerald-400 border-emerald-800': dockerStatus === 'running',
                 'bg-zinc-800 text-zinc-400 border-zinc-700': dockerStatus === 'stopped',
                 'bg-red-950/80 text-red-400 border-red-800 animate-pulse': dockerStatus === 'unhealthy'
               }"
            >
              <span
                class="w-2 h-2 rounded-full"
                :class="{
                    'bg-emerald-400': dockerStatus === 'running',
                    'bg-zinc-500': dockerStatus === 'stopped',
                    'bg-red-400': dockerStatus === 'unhealthy'
                  }"
              ></span>
              <span
                x-text="dockerStatus === 'running' ? '● RUNNING (Port 5620)' : (dockerStatus === 'stopped' ? '○ STOPPED' : '▲ UNHEALTHY (マウント不可: パス長超過を検出)')"
              ></span>
            </div>
            <span class="text-xs text-fluent-subtext font-mono"
              >tag-based-video-manager</span
            >
          </div>

          <!-- Controller Buttons -->
          <div class="flex items-center space-x-2">
            <button
              @click="triggerDockerAction('up')"
              :disabled="isDockerProcessing"
              class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-white border border-fluent-border flex items-center gap-1.5 transition"
            >
              <span>▶</span> Start
            </button>
            <button
              @click="triggerDockerAction('down')"
              :disabled="isDockerProcessing"
              class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-white border border-fluent-border flex items-center gap-1.5 transition"
            >
              <span>■</span> Stop
            </button>
            <button
              @click="triggerDockerAction('restart')"
              :disabled="isDockerProcessing"
              class="px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white shadow flex items-center gap-1.5 transition"
            >
              <span :class="{'animate-spin': isDockerProcessing}">🔄</span>
              Restart
            </button>
            <button
              @click="toggleDockerStatusSim()"
              class="px-2 py-1.5 rounded bg-zinc-900/60 text-[10px] text-zinc-500 hover:text-zinc-300 border border-zinc-800"
            >
              状態切替(Demo)
            </button>
          </div>
        </div>

        <!-- SECTION 2: Scan Target & Rule Config -->
        <div
          class="bg-fluent-surface border border-fluent-border rounded-lg p-3.5 space-y-3 shadow-sm text-xs flex-shrink-0"
        >
          <!-- Row 1: Target Folder & Filter Criterion -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex-1 min-w-[320px] flex items-center space-x-2">
              <label class="text-fluent-subtext font-semibold flex-shrink-0"
                >対象フォルダ:</label
              >
              <div
                class="flex-1 flex items-center bg-zinc-900 border border-fluent-border rounded px-2.5 py-1.5"
              >
                <span class="text-zinc-500 mr-2">📁</span>
                <input
                  type="text"
                  x-model="targetDir"
                  class="bg-transparent flex-1 outline-none text-fluent-text font-mono text-xs"
                />
              </div>
              <button
                class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded border border-fluent-border font-medium"
              >
                参照...
              </button>
            </div>

            <!-- Clear Criterion Definition Badge -->
            <div
              class="flex items-center space-x-2 bg-zinc-900/90 border border-red-900/60 px-3 py-1.5 rounded"
            >
              <span class="text-xs text-fluent-subtext font-medium"
                >リネーム抽出条件:</span
              >
              <span
                class="px-2 py-0.5 rounded text-[11px] font-bold bg-red-950 text-red-400 border border-red-800 flex items-center gap-1"
              >
                <span>⚠️</span> 絶対パス長 ≧ 240文字 (Docker上限 260字対策)
              </span>
              <span
                class="text-xs font-bold text-white ml-2"
                x-text="'検出: ' + files.length + ' 件'"
              ></span>
            </div>
          </div>

          <!-- Row 2: AI Rule & Model -->
          <div
            class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center pt-2 border-t border-fluent-border/60"
          >
            <div class="md:col-span-4 flex items-center space-x-2">
              <label class="text-fluent-subtext font-semibold flex-shrink-0"
                >AIモデル:</label
              >
              <select
                x-model="selectedModel"
                class="flex-1 bg-zinc-900 border border-fluent-border rounded px-2.5 py-1.5 text-fluent-text outline-none"
              >
                <option value="meta-llama/llama-3.3-70b-instruct:free">
                  OpenRouter: Llama-3.3 70B (Free)
                </option>
                <option value="google/gemini-2.0-flash-exp:free">
                  OpenRouter: Gemini 2.0 Flash (Free)
                </option>
                <option value="mistralai/mistral-small-24b-instruct-2501:free">
                  OpenRouter: Mistral Small (Free)
                </option>
              </select>
            </div>

            <div class="md:col-span-5 flex items-center space-x-2">
              <label class="text-fluent-subtext font-semibold flex-shrink-0"
                >命名規則:</label
              >
              <select
                x-model="selectedPreset"
                @change="onPresetChange()"
                class="flex-1 bg-zinc-900 border border-fluent-border rounded px-2.5 py-1.5 text-fluent-text outline-none"
              >
                <option value="date_summary">[日付]_[要約(20文字以内)]</option>
                <option value="date_folder_seq">
                  [日付]_[フォルダ名]_[通番]
                </option>
                <option value="folder_keywords">
                  [フォルダ名]_[キーワード]
                </option>
                <option value="custom">カスタムプロンプト指定...</option>
              </select>
            </div>

            <div class="md:col-span-3 flex justify-end">
              <button
                @click="reGenerateAiSuggestions()"
                :disabled="isGeneratingAi"
                class="w-full sm:w-auto px-4 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded text-xs font-bold text-white shadow flex items-center justify-center gap-2 transition disabled:opacity-50"
              >
                <span :class="{'animate-spin': isGeneratingAi}">✨</span>
                <span>AI再提案を取得</span>
              </button>
            </div>
          </div>

          <!-- Custom Prompt Line -->
          <div
            x-show="selectedPreset === 'custom'"
            x-transition
            class="pt-1 flex items-center space-x-2"
          >
            <label class="text-fluent-subtext font-semibold flex-shrink-0"
              >カスタム指示:</label
            >
            <input
              type="text"
              x-model="customPrompt"
              class="flex-1 bg-zinc-900 border border-fluent-border rounded px-2.5 py-1 text-fluent-text text-xs outline-none"
            />
          </div>
        </div>

        <!-- SECTION 3: BEFORE / AFTER Comparison View (Card List) -->
        <div
          class="flex-1 bg-fluent-surface border border-fluent-border rounded-lg flex flex-col overflow-hidden shadow-sm"
        >
          <!-- Header Bar -->
          <div
            class="bg-zinc-900 px-4 py-2.5 border-b border-fluent-border flex items-center justify-between text-xs flex-shrink-0"
          >
            <div class="flex items-center space-x-3">
              <input
                type="checkbox"
                x-model="selectAll"
                @change="toggleSelectAll()"
                class="w-4 h-4 rounded accent-blue-500 cursor-pointer"
              />
              <span class="font-bold text-white"
                >リネーム対象ファイル (Before / After 比較確認)</span
              >
              <span
                class="text-fluent-subtext"
                x-text="'(' + selectedCount + ' / ' + files.length + ' 件選択中)'"
              ></span>
            </div>
            <div class="flex items-center space-x-4 text-[11px]">
              <span
                class="flex items-center gap-1.5 text-red-400 font-semibold"
              >
                <span class="w-2.5 h-2.5 rounded bg-red-500"></span> BEFORE:
                240字超 (マウント不可)
              </span>
              <span
                class="flex items-center gap-1.5 text-emerald-400 font-semibold"
              >
                <span class="w-2.5 h-2.5 rounded bg-emerald-500"></span> AFTER:
                短縮完了 (安全)
              </span>
            </div>
          </div>

          <!-- Scrollable Comparison Cards -->
          <div class="flex-1 overflow-y-auto p-3 space-y-3">
            <template x-for="(file, index) in files" :key="file.id">
              <div
                class="border rounded-lg p-3 transition shadow-sm"
                :class="{
                   'bg-zinc-900/90 border-blue-600/70 ring-1 ring-blue-500/40': file.selected,
                   'bg-zinc-900/40 border-zinc-800 opacity-60': !file.selected
                 }"
              >
                <!-- Card Header: Selection & Metrics -->
                <div
                  class="flex items-center justify-between pb-2 border-b border-zinc-800 mb-2.5 text-xs"
                >
                  <div class="flex items-center space-x-2.5">
                    <input
                      type="checkbox"
                      x-model="file.selected"
                      class="w-4 h-4 rounded accent-blue-500 cursor-pointer"
                    />
                    <span
                      class="font-bold text-zinc-300"
                      x-text="'#' + (index + 1)"
                    ></span>
                    <span
                      class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-950 text-red-400 border border-red-800"
                    >
                      ⚠️ パス長超過 (マウント不可)
                    </span>
                  </div>

                  <!-- Reduction Metric Badge -->
                  <div class="flex items-center space-x-2">
                    <span class="text-[11px] text-zinc-400">短縮効果:</span>
                    <span
                      class="px-2 py-0.5 rounded text-xs font-mono font-bold bg-emerald-950 text-emerald-400 border border-emerald-800"
                      x-text="'-' + (file.beforeLength - file.afterLength) + ' 文字 (' + Math.round((1 - file.afterLength/file.beforeLength)*100) + '% 削減)'"
                    ></span>
                    <span
                      class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-950 text-blue-400 border border-blue-800"
                    >
                      ✓ マウント安全
                    </span>
                  </div>
                </div>

                <!-- Comparison Body: Grid layout (BEFORE vs AFTER) -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 text-xs">
                  <!-- BEFORE Box (Red tone) -->
                  <div
                    class="bg-red-950/20 border border-red-900/40 rounded p-2.5 space-y-1.5"
                  >
                    <div class="flex items-center justify-between">
                      <span
                        class="text-[11px] font-bold uppercase tracking-wider text-red-400 flex items-center gap-1"
                      >
                        <span>●</span> BEFORE (変更前の現ファイル)
                      </span>
                      <span
                        class="font-mono font-bold text-red-400 bg-red-950 px-2 py-0.5 rounded text-[11px] border border-red-900"
                        x-text="'現パス長: ' + file.beforeLength + ' 文字'"
                      ></span>
                    </div>
                    <!-- Folder Path -->
                    <div class="text-[11px] text-zinc-400 font-mono break-all">
                      <span class="text-zinc-500">フォルダ: </span>
                      <span x-text="file.folderPath"></span>
                    </div>
                    <!-- File Name -->
                    <div
                      class="font-mono text-zinc-200 font-semibold break-all bg-black/40 p-1.5 rounded border border-red-900/30"
                    >
                      <span class="text-zinc-500 text-[10px] block"
                        >ファイル名:</span
                      >
                      <span
                        class="text-red-300"
                        x-text="file.beforeFileName"
                      ></span>
                    </div>
                  </div>

                  <!-- AFTER Box (Emerald tone) -->
                  <div
                    class="bg-emerald-950/20 border border-emerald-900/40 rounded p-2.5 space-y-1.5"
                  >
                    <div class="flex items-center justify-between">
                      <span
                        class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1"
                      >
                        <span>✓</span> AFTER (変更後 / AI提案・直接編集可能)
                      </span>
                      <span
                        class="font-mono font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded text-[11px] border border-emerald-900"
                        x-text="'新パス長: ' + file.afterLength + ' 文字'"
                      ></span>
                    </div>
                    <!-- Folder Path -->
                    <div class="text-[11px] text-zinc-400 font-mono break-all">
                      <span class="text-zinc-500">フォルダ: </span>
                      <span x-text="file.folderPath"></span>
                    </div>
                    <!-- File Name Input (Directly Editable) -->
                    <div>
                      <div class="text-zinc-500 text-[10px] block mb-0.5">
                        新ファイル名 (手動微調整可能):
                      </div>
                      <div class="relative flex items-center">
                        <input
                          type="text"
                          x-model="file.afterFileName"
                          @input="recalculateLength(file)"
                          class="w-full bg-black/70 border border-emerald-600/80 rounded px-2.5 py-1.5 text-xs font-mono text-emerald-300 focus:outline-none focus:ring-1 focus:ring-emerald-400 transition"
                          placeholder="新ファイル名..."
                        />
                        <span
                          class="absolute right-2 text-[10px] text-blue-400 font-bold bg-blue-950 px-1.5 py-0.5 rounded border border-blue-800"
                          >AI提案済</span
                        >
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Footer Actions Bar -->
          <div
            class="bg-fluent-surface border-t border-fluent-border p-3 px-4 flex flex-wrap items-center justify-between gap-3 flex-shrink-0"
          >
            <div class="text-xs text-fluent-subtext">
              <span>リネーム対象確定: </span>
              <span
                class="font-bold text-white text-sm"
                x-text="selectedCount + ' 件'"
              ></span>
              <span class="text-emerald-400 text-xs ml-3 font-semibold"
                >✓ すべて260文字制限を大幅にクリア（平均80%短縮）</span
              >
            </div>

            <div class="flex items-center space-x-3">
              <button
                @click="executeRename(false)"
                :disabled="selectedCount === 0 || isExecuting"
                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-semibold text-white border border-fluent-border transition disabled:opacity-40"
              >
                リネームのみ実行
              </button>
              <button
                @click="executeRename(true)"
                :disabled="selectedCount === 0 || isExecuting"
                class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white shadow-lg flex items-center gap-2 transition disabled:opacity-40"
              >
                <span>⚡</span>
                <span>リネームしてコンテナ再起動 (ワンクリック復旧)</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Execution Modal -->
      <div
        x-show="showProgressModal"
        x-transition
        class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50"
      >
        <div
          class="bg-fluent-surface border border-fluent-border rounded-xl p-6 max-w-md w-full shadow-2xl space-y-4"
        >
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <span class="animate-spin text-blue-400">🔄</span>
            <span>処理を実行中...</span>
          </h3>

          <div
            class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden border border-zinc-700"
          >
            <div
              class="bg-blue-500 h-full transition-all duration-300"
              :style="'width: ' + progressPercent + '%'"
            ></div>
          </div>
          <p
            class="text-xs text-fluent-subtext font-mono"
            x-text="progressMessage"
          ></p>

          <div x-show="isExecutionComplete" class="pt-2 flex justify-end">
            <button
              @click="showProgressModal = false"
              class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white"
            >
              閉じる
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Notification -->
      <div
        x-show="showToast"
        x-transition
        class="fixed bottom-6 right-6 bg-zinc-800 border border-fluent-border text-white text-xs px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2 z-50"
      >
        <span class="text-emerald-400 font-bold">✓</span>
        <span x-text="toastMessage"></span>
      </div>
    </div>

    <script>
      function companionApp() {
        return {
          dockerStatus: "unhealthy", // 'running', 'stopped', 'unhealthy'
