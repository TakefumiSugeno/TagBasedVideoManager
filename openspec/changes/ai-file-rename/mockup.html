<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TagBasedVideoManager - AI File Renamer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              fluent: {
                bg: "#1a1a1a",
                surface: "#222222",
                card: "#2a2a2a",
                border: "#383838",
                accent: "#0078d4",
                accentHover: "#1084d8",
                text: "#ffffff",
                subtext: "#909090",
                danger: "#e81123",
                warning: "#fce100",
                success: "#107c41",
              },
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #404040;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555555;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-fluent-text font-sans p-2 sm:p-5 flex justify-center items-center min-h-screen antialiased select-none"
    x-data="companionApp()"
  >
    <!-- Desktop App Window (Windows 11 Fluent) -->
    <div
      class="w-full max-w-6xl bg-fluent-bg border border-fluent-border rounded-xl shadow-2xl overflow-hidden flex flex-col h-[94vh] max-h-[920px]"
    >
      <!-- Titlebar: Clear app name showing renaming capability, no F# mention -->
      <div
        class="bg-fluent-surface border-b border-fluent-border px-4 py-2 flex items-center justify-between flex-shrink-0"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-5 h-5 rounded bg-blue-600 flex items-center justify-center text-[10px] font-bold shadow text-white"
          >
            ▶
          </div>
          <span class="text-xs font-semibold text-fluent-text tracking-wide"
            >TagBasedVideoManager - AI File Renamer</span
          >
        </div>
        <div class="flex items-center space-x-3 text-fluent-subtext text-xs">
          <button class="hover:text-white px-2 py-1">─</button>
          <button class="hover:text-white px-2 py-1">□</button>
          <button class="hover:text-fluent-danger px-2 py-1 font-bold">
            ✕
          </button>
        </div>
      </div>

      <!-- Main Container -->
      <div class="flex-1 flex flex-col overflow-hidden p-3.5 space-y-3">
        <!-- SECTION 1: Docker Status Controller -->
        <div
          class="bg-fluent-surface border border-fluent-border rounded-lg p-2.5 px-3 flex flex-wrap items-center justify-between gap-2 shadow-sm flex-shrink-0"
        >
          <div class="flex items-center space-x-3 text-xs">
            <span
              class="text-fluent-subtext font-semibold flex items-center gap-1.5"
            >
              <svg
                class="w-3.5 h-3.5 text-blue-400"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.186.185.186m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.186.185.186m-2.953 2.714h2.118a.186.186 0 00.186-.185V9.006a.185.185 0 00-.186-.186H8.076a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m0-2.714h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185H8.076a.185.185 0 00-.185.185v1.887c0 .102.083.186.185.186m-2.955 5.428h2.119a.186.186 0 00.185-.185V11.72a.186.186 0 00-.185-.186H5.121a.186.186 0 00-.185.186v1.887c0 .103.083.185.185.185m0-2.714h2.119a.186.186 0 00.185-.186V9.006a.185.185 0 00-.185-.186H5.121a.186.186 0 00-.185.185v1.888c0 .102.083.185.185.185m0-2.714h2.119a.186.186 0 00.185-.186V6.29a.186.186 0 00-.185-.185H5.121a.186.186 0 00-.185.185v1.887c0 .102.083.186.185.186m16.598 4.298c-.147-.323-.396-.582-.71-.741a4.954 4.954 0 00-1.685-.436H16.32a.186.186 0 00-.186.185v1.888c0 .102.083.185.186.185h2.47c.075 0 .144.027.198.077.062.058.093.136.086.22-.051.61-.413 1.139-.99 1.44-.45.234-.97.357-1.492.357H3.454c-.663 0-1.287-.272-1.743-.761A2.528 2.528 0 011 15.632c0-.704.281-1.365.776-1.859.458-.458 1.066-.723 1.706-.745.18-.006.326-.153.326-.334v-.486c0-.986.386-1.914 1.085-2.614.7-.7 1.628-1.085 2.614-1.085.183 0 .332-.146.332-.33v-.486c0-.986.386-1.913 1.086-2.613A3.705 3.705 0 0111.538 4c.987 0 1.914.385 2.614 1.084.7.7 1.085 1.627 1.085 2.613v.486c0 .184.148.33.332.33.986 0 1.914.386 2.613 1.086.7.7 1.086 1.627 1.086 2.613v.486c0 .18.146.328.326.334.64.022 1.248.287 1.706.745.495.494.776 1.155.776 1.859a2.534 2.534 0 01-.71 1.794c-.456.489-1.08.761-1.743.761H17.84a.185.185 0 01-.186-.185v-1.888a.186.186 0 01.186-.185h2.47c.522 0 1.042-.123 1.492-.357.577-.301.939-.83 1.012-1.44a.186.186 0 00-.095-.19z"
                />
              </svg>
              Docker:
            </span>
            <div
              class="flex items-center space-x-2 px-2.5 py-0.5 rounded-full text-xs font-semibold border"
              :class="{
                 'bg-emerald-950/80 text-emerald-400 border-emerald-800': dockerStatus === 'running',
                 'bg-zinc-800 text-zinc-400 border-zinc-700': dockerStatus === 'stopped',
                 'bg-red-950/80 text-red-400 border-red-800 animate-pulse': dockerStatus === 'unhealthy'
               }"
            >
              <span
                class="w-2 h-2 rounded-full"
                :class="{
                    'bg-emerald-400': dockerStatus === 'running',
                    'bg-zinc-500': dockerStatus === 'stopped',
                    'bg-red-400': dockerStatus === 'unhealthy'
                  }"
              ></span>
              <span
                x-text="dockerStatus === 'running' ? '● RUNNING (Port 5620)' : (dockerStatus === 'stopped' ? '○ STOPPED' : '▲ UNHEALTHY (マウント不可: パス長超過を検出)')"
              ></span>
            </div>
            <span class="text-[11px] text-fluent-subtext font-mono"
              >tag-based-video-manager</span
            >
          </div>

          <div class="flex items-center space-x-1.5">
            <button
              @click="triggerDockerAction('up')"
              class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-white border border-fluent-border"
            >
              ▶ Start
            </button>
            <button
              @click="triggerDockerAction('down')"
              class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-white border border-fluent-border"
            >
              ■ Stop
            </button>
            <button
              @click="triggerDockerAction('restart')"
              class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white shadow flex items-center gap-1"
            >
              <span :class="{'animate-spin': isDockerProcessing}">🔄</span>
              Restart
            </button>
            <button
              @click="toggleDockerStatusSim()"
              class="px-2 py-1 rounded bg-zinc-900/60 text-[10px] text-zinc-500 hover:text-zinc-300 border border-zinc-800"
            >
              Demo切替
            </button>
          </div>
        </div>

        <!-- SECTION 2: Configuration & Single-Action Execution Bar -->
        <div
          class="bg-fluent-surface border border-fluent-border rounded-lg p-3 space-y-2.5 shadow-sm text-xs flex-shrink-0"
        >
          <!-- Row 1: Target Folder & Criteria Information -->
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <div class="flex-1 min-w-[340px] flex items-center space-x-2">
              <label
                class="text-fluent-subtext font-semibold flex-shrink-0 w-20"
                >対象フォルダ:</label
              >
              <div
                class="flex-1 flex items-center bg-zinc-900 border border-fluent-border rounded px-2.5 py-1"
              >
                <span class="text-zinc-500 mr-1.5">📁</span>
                <input
                  type="text"
                  x-model="targetDir"
                  class="bg-transparent flex-1 outline-none text-fluent-text font-mono text-xs"
                  title="設定ファイルより自動取得済"
                />
              </div>
              <button
                class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded border border-fluent-border font-medium"
              >
                参照...
              </button>
            </div>

            <div
              class="flex items-center space-x-2 bg-zinc-900/90 border border-red-900/60 px-2.5 py-1 rounded"
            >
              <span class="text-xs text-fluent-subtext font-medium"
                >抽出基準:</span
              >
              <span
                class="px-2 py-0.5 rounded text-[11px] font-bold bg-red-950 text-red-400 border border-red-800"
              >
                ⚠️ 絶対パス長 ≧ 240文字 (Docker 260字対策)
              </span>
              <span
                class="text-xs font-bold text-white ml-1"
                x-text="'検出: ' + (filesLoaded ? files.length + ' 件' : '未実行')"
              ></span>
            </div>
          </div>

          <!-- Row 2: AI Model, Naming Rule Preset & Manager Button, and MAIN ACTION BUTTON -->
          <div
            class="flex flex-wrap items-center justify-between gap-2.5 pt-2 border-t border-fluent-border/60"
          >
            <div class="flex flex-wrap items-center gap-3">
              <!-- Model -->
              <div class="flex items-center space-x-1.5">
                <label class="text-fluent-subtext font-semibold"
                  >AIモデル:</label
                >
                <select
                  x-model="selectedModel"
                  class="bg-zinc-900 border border-fluent-border rounded px-2 py-1 text-fluent-text text-xs outline-none"
                >
                  <option value="meta-llama/llama-3.3-70b-instruct:free">
                    Llama-3.3 70B (Free)
                  </option>
                  <option value="google/gemini-2.0-flash-exp:free">
                    Gemini 2.0 Flash (Free)
                  </option>
                  <option
                    value="mistralai/mistral-small-24b-instruct-2501:free"
                  >
                    Mistral Small (Free)
                  </option>
                </select>
              </div>

              <!-- Naming Rule -->
              <div class="flex items-center space-x-1.5">
                <label class="text-fluent-subtext font-semibold"
                  >命名規則:</label
                >
                <select
                  x-model="selectedRuleId"
                  class="bg-zinc-900 border border-fluent-border rounded px-2 py-1 text-fluent-text text-xs outline-none"
                >
                  <template x-for="(rule, idx) in rules" :key="rule.id">
                    <option
                      :value="rule.id"
                      x-text="(idx === 0 ? '★ ' : '') + rule.name"
                    ></option>
                  </template>
                </select>
                <!-- Rule Manager Trigger -->
                <button
                  @click="openRuleManager()"
                  class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 rounded border border-fluent-border text-zinc-300 hover:text-white flex items-center gap-1 font-medium"
                  title="命名規則の作成・編集・並び替え"
                >
                  <span>⚙</span> <span>管理...</span>
                </button>
              </div>
            </div>

            <!-- PRIMARY ACTION BUTTON -->
            <div>
              <button
                @click="executeScanAndPropose()"
                :disabled="isProcessing"
                class="px-5 py-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded text-xs font-bold text-white shadow-lg flex items-center gap-2 transition disabled:opacity-50"
              >
                <span :class="{'animate-spin': isProcessing}">🔍</span>
                <span
                  x-text="filesLoaded ? '⚡ 再抽出 ＆ AI提案を再実行' : '🚀 リネーム対象抽出 ＆ AI提案を実行'"
                ></span>
              </button>
            </div>
          </div>
        </div>

        <!-- SECTION 3: BEFORE / AFTER Comparison View -->
        <div
          class="flex-1 bg-fluent-surface border border-fluent-border rounded-lg flex flex-col overflow-hidden shadow-sm"
        >
          <!-- Header Toolbar & Layout Toggle: "上下並び" and "左右並び" -->
          <div
            class="bg-zinc-900 px-3.5 py-2 border-b border-fluent-border flex items-center justify-between text-xs flex-shrink-0"
          >
            <div class="flex items-center space-x-3">
              <input
                type="checkbox"
                x-model="selectAll"
                @change="toggleSelectAll()"
                class="w-4 h-4 rounded accent-blue-500 cursor-pointer"
                :disabled="!filesLoaded"
              />
              <span class="font-bold text-white">Before / After 対比確認</span>
              <span
                class="text-fluent-subtext"
                x-text="filesLoaded ? '(' + selectedCount + ' / ' + files.length + ' 件選択中)' : '(実行ボタンを押して抽出)'"
              ></span>
            </div>

            <!-- View Layout Switcher (Simplified: "上下並び" vs "左右並び") -->
            <div class="flex items-center space-x-2">
              <span class="text-fluent-subtext text-[11px]">表示形式:</span>
              <div
                class="bg-zinc-800 p-0.5 rounded border border-zinc-700 flex items-center"
              >
                <button
                  @click="layoutMode = 'vertical'"
                  :class="layoutMode === 'vertical' ? 'bg-blue-600 text-white font-bold' : 'text-zinc-400 hover:text-white'"
                  class="px-2.5 py-0.5 rounded text-[11px] flex items-center gap-1 transition"
                  title="上下に薄く並べて視線移動を最小化"
                >
                  <span>▤</span> 上下並び
                </button>
                <button
                  @click="layoutMode = 'horizontal'"
                  :class="layoutMode === 'horizontal' ? 'bg-blue-600 text-white font-bold' : 'text-zinc-400 hover:text-white'"
                  class="px-2.5 py-0.5 rounded text-[11px] flex items-center gap-1 transition"
                  title="左右2列で対比"
                >
                  <span>◫</span> 左右並び
                </button>
              </div>
            </div>
          </div>

          <!-- Scrollable Comparison List -->
          <div class="flex-1 overflow-y-auto p-2.5 space-y-2">
            <template x-if="!filesLoaded">
              <div
                class="h-full flex flex-col items-center justify-center text-fluent-subtext space-y-2 py-12"
              >
                <div class="text-3xl text-zinc-600">📁</div>
                <p class="text-xs">
                  上の「<strong>リネーム対象抽出 ＆ AI提案を実行</strong
                  >」ボタンを押してください
                </p>
                <p class="text-[11px] text-zinc-500">
                  設定済みのフォルダから240文字以上の長パスファイルを自動検出し、AI提案を生成します
                </p>
              </div>
            </template>

            <template x-if="filesLoaded">
              <div class="space-y-2">
                <template x-for="(file, index) in files" :key="file.id">
                  <div
                    class="border rounded-md transition shadow-sm"
                    :class="{
                       'bg-zinc-900/90 border-blue-600/70 ring-1 ring-blue-500/30': file.selected,
                       'bg-zinc-900/40 border-zinc-800 opacity-60': !file.selected
                     }"
                  >
                    <!-- MODE A: VERTICAL (上下並び - 極低ハイトで上下が見比べやすい) -->
                    <div
                      x-show="layoutMode === 'vertical'"
                      class="p-2 space-y-1 text-xs"
                    >
                      <!-- Line 1: Header / Checkbox / Folder & Metrics -->
                      <div
                        class="flex items-center justify-between text-[11px] pb-1 border-b border-zinc-800"
                      >
                        <div class="flex items-center space-x-2">
                          <input
                            type="checkbox"
                            x-model="file.selected"
                            class="w-3.5 h-3.5 rounded accent-blue-500 cursor-pointer"
                          />
                          <span
                            class="font-bold text-zinc-300"
                            x-text="'#' + (index + 1)"
                          ></span>
                          <span
                            class="text-zinc-500 font-mono text-[10px] truncate max-w-[480px]"
                            x-text="file.folderPath + '\\'"
                          ></span>
                        </div>
                        <div class="flex items-center space-x-2">
                          <span
                            class="px-1.5 py-0.2 rounded text-[10px] font-mono font-bold bg-emerald-950 text-emerald-400 border border-emerald-800"
                            x-text="'-' + (file.beforeLength - file.afterLength) + '字 (' + Math.round((1 - file.afterLength/file.beforeLength)*100) + '%短縮)'"
                          ></span>
                          <span class="text-emerald-400 font-bold text-[10px]"
                            >✓ 安全</span
                          >
                        </div>
                      </div>

                      <!-- Line 2: BEFORE (変更前 - 薄い赤背景で高さ低く) -->
                      <div
                        class="flex items-center space-x-2 bg-red-950/30 border border-red-900/40 rounded px-2 py-1"
                      >
                        <span
                          class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-950 text-red-400 border border-red-900 flex-shrink-0"
                        >
                          BEFORE (<span x-text="file.beforeLength"></span>字
                          [危険])
                        </span>
                        <span
                          class="font-mono text-red-200 text-xs truncate flex-1 font-medium"
                          x-text="file.beforeFileName"
                        ></span>
                      </div>

                      <!-- Line 3: AFTER (変更後 - 薄い緑背景、直下に並ぶので一目瞭然) -->
                      <div
                        class="flex items-center space-x-2 bg-emerald-950/30 border border-emerald-900/40 rounded px-2 py-1"
                      >
                        <span
                          class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-900 flex-shrink-0"
                        >
                          AFTER (<span x-text="file.afterLength"></span>字
                          [安全])
                        </span>
                        <input
                          type="text"
                          x-model="file.afterFileName"
                          @input="recalculateLength(file)"
                          class="flex-1 bg-black/80 border border-emerald-600/80 rounded px-2 py-0.5 text-xs font-mono text-emerald-300 focus:outline-none focus:ring-1 focus:ring-emerald-400"
                          placeholder="新ファイル名..."
                        />
                        <span
                          class="text-[10px] text-blue-400 font-bold bg-blue-950 px-1.5 py-0.5 rounded border border-blue-800 flex-shrink-0"
                          >AI提案済</span
                        >
                      </div>

                      <!-- Line 4: AI Comment Box (理由・命名規則適合状況の説明) -->
                      <div
                        class="flex items-start space-x-1.5 pt-0.5 text-[11px]"
                        :class="file.isIrregular ? 'text-amber-300' : 'text-zinc-400'"
                      >
                        <span
                          class="font-bold flex-shrink-0"
                          x-text="file.isIrregular ? '⚠️ AIコメント:' : '💬 AIコメント:'"
                        ></span>
                        <span
                          class="font-sans leading-tight italic"
                          x-text="file.aiComment"
                        ></span>
                      </div>
                    </div>

                    <!-- MODE B: HORIZONTAL (左右2列並び) -->
                    <div
                      x-show="layoutMode === 'horizontal'"
                      class="p-2.5 space-y-2 text-xs"
                    >
                      <div
                        class="flex items-center justify-between text-[11px] pb-1 border-b border-zinc-800"
                      >
                        <div class="flex items-center space-x-2">
                          <input
                            type="checkbox"
                            x-model="file.selected"
                            class="w-3.5 h-3.5 rounded accent-blue-500 cursor-pointer"
                          />
                          <span
                            class="font-bold text-zinc-300"
                            x-text="'#' + (index + 1)"
                          ></span>
                          <span
                            class="text-zinc-500 font-mono text-[10px] truncate max-w-[480px]"
                            x-text="file.folderPath"
                          ></span>
                        </div>
                        <span
                          class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-emerald-950 text-emerald-400 border border-emerald-800"
                          x-text="'-' + (file.beforeLength - file.afterLength) + '字短縮 (' + Math.round((1 - file.afterLength/file.beforeLength)*100) + '%削減)'"
                        ></span>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <!-- Before Box -->
                        <div
                          class="bg-red-950/20 border border-red-900/40 rounded p-2 space-y-1"
                        >
                          <div class="flex justify-between text-[11px]">
                            <span class="text-red-400 font-bold"
                              >● BEFORE (現ファイル)</span
                            >
                            <span
                              class="font-mono text-red-400 font-bold"
                              x-text="file.beforeLength + '字 [危険]'"
                            ></span>
                          </div>
                          <div
                            class="font-mono text-red-200 text-xs break-all bg-black/40 p-1.5 rounded"
                            x-text="file.beforeFileName"
                          ></div>
                        </div>

                        <!-- After Box with AI Comment -->
                        <div
                          class="bg-emerald-950/20 border border-emerald-900/40 rounded p-2 space-y-1.5 flex flex-col justify-between"
                        >
                          <div>
                            <div class="flex justify-between text-[11px] mb-1">
                              <span class="text-emerald-400 font-bold"
                                >✓ AFTER (AI提案 / 編集可)</span
                              >
                              <span
                                class="font-mono text-emerald-400 font-bold"
                                x-text="file.afterLength + '字 [安全]'"
                              ></span>
                            </div>
                            <input
                              type="text"
                              x-model="file.afterFileName"
                              @input="recalculateLength(file)"
                              class="w-full bg-black/80 border border-emerald-600/80 rounded px-2 py-1 text-xs font-mono text-emerald-300 focus:outline-none"
                            />
                          </div>
                          <!-- AI Comment Box -->
                          <div
                            class="text-[11px] pt-1 border-t border-emerald-900/40 flex items-start gap-1"
                            :class="file.isIrregular ? 'text-amber-300' : 'text-zinc-400'"
                          >
                            <span
                              class="font-bold flex-shrink-0"
                              x-text="file.isIrregular ? '⚠️ AIコメント:' : '💬 AIコメント:'"
                            ></span>
                            <span
                              class="font-sans leading-tight italic"
                              x-text="file.aiComment"
                            ></span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Footer Actions Bar with UNDO Button -->
          <div
            class="bg-fluent-surface border-t border-fluent-border p-2.5 px-4 flex flex-wrap items-center justify-between gap-3 flex-shrink-0"
          >
            <div class="flex items-center space-x-3 text-xs">
              <span class="text-fluent-subtext">確定件数: </span>
              <span
                class="font-bold text-white text-sm"
                x-text="selectedCount + ' 件'"
              ></span>
              <span
                class="text-emerald-400 text-xs font-semibold"
                x-show="filesLoaded"
                >✓ 260文字制限を完全クリア</span
              >

              <!-- UNDO BUTTON -->
              <button
                x-show="undoAvailable"
                @click="executeUndo()"
                class="ml-4 px-3 py-1 bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-700 rounded text-xs font-bold flex items-center gap-1.5 shadow transition"
              >
                <span>↩</span>
                <span
                  >直前のリネームを元に戻す (Undo:
                  <span x-text="undoHistory.length"></span>件)</span
                >
              </button>
            </div>

            <div class="flex items-center space-x-2.5">
              <button
                @click="executeRename(false)"
                :disabled="selectedCount === 0 || isProcessing"
                class="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-semibold text-white border border-fluent-border transition disabled:opacity-40"
              >
                リネームのみ実行
              </button>
              <button
                @click="executeRename(true)"
                :disabled="selectedCount === 0 || isProcessing"
                class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white shadow-lg flex items-center gap-2 transition disabled:opacity-40"
              >
                <span>⚡</span>
                <span>リネームしてコンテナ再起動</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL: Naming Rule Manager -->
      <div
        x-show="showRuleManager"
        x-transition
        class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50"
      >
        <div
          class="bg-fluent-surface border border-fluent-border rounded-xl p-5 max-w-2xl w-full shadow-2xl space-y-4"
        >
          <div
            class="flex items-center justify-between border-b border-fluent-border pb-2.5"
          >
            <div class="flex items-center space-x-2">
              <span class="text-blue-400 text-base">⚙</span>
              <h3 class="text-sm font-bold text-white">
                命名規則マネージャー (作成・編集・並び替え)
              </h3>
            </div>
            <button
              @click="showRuleManager = false"
              class="text-zinc-400 hover:text-white font-bold text-sm"
            >
              ✕
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 text-xs">
            <!-- Left: Preset List -->
            <div
              class="md:col-span-5 space-y-2 border-r border-fluent-border/60 pr-3"
            >
              <div class="flex justify-between items-center">
                <span class="text-fluent-subtext font-semibold"
                  >登録ルール一覧 (最上が起動時既定):</span
                >
                <button
                  @click="addNewRule()"
                  class="text-blue-400 hover:text-blue-300 font-bold text-[11px]"
                >
                  + 新規追加
                </button>
              </div>

              <div class="space-y-1.5 max-h-[260px] overflow-y-auto">
                <template x-for="(r, idx) in rules" :key="r.id">
                  <div
                    @click="activeEditRule = r"
                    class="p-2 rounded border cursor-pointer flex items-center justify-between transition"
                    :class="activeEditRule.id === r.id ? 'bg-blue-950/70 border-blue-500 text-white' : 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:bg-zinc-800'"
                  >
                    <div class="flex items-center space-x-1.5 truncate">
                      <span
                        x-show="idx === 0"
                        class="text-amber-400 text-[10px] font-bold"
                        >★既定</span
                      >
                      <span class="font-medium truncate" x-text="r.name"></span>
                    </div>
                    <div class="flex items-center space-x-1" @click.stop>
                      <button
                        @click="moveRule(idx, -1)"
                        :disabled="idx === 0"
                        class="text-[10px] px-1 hover:text-white disabled:opacity-20"
                      >
                        ▲
                      </button>
                      <button
                        @click="moveRule(idx, 1)"
                        :disabled="idx === rules.length - 1"
                        class="text-[10px] px-1 hover:text-white disabled:opacity-20"
                      >
                        ▼
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Right: Rule Editor -->
            <div class="md:col-span-7 space-y-3">
              <template x-if="activeEditRule">
                <div class="space-y-3">
                  <div>
                    <label class="text-fluent-subtext block mb-1 font-medium"
                      >ルール表示名:</label
                    >
                    <input
                      type="text"
                      x-model="activeEditRule.name"
                      class="w-full bg-zinc-900 border border-fluent-border rounded px-2.5 py-1 text-white"
                    />
                  </div>

                  <div>
                    <label class="text-fluent-subtext block mb-1 font-medium"
                      >ファイル名パターン (タグ挿入可):</label
                    >
                    <input
                      type="text"
                      x-model="activeEditRule.pattern"
                      class="w-full bg-zinc-900 border border-fluent-border rounded px-2.5 py-1 font-mono text-emerald-300"
                    />
                    <div class="flex flex-wrap gap-1 mt-1.5">
                      <span class="text-[10px] text-zinc-500 mr-1">挿入:</span>
                      <button
                        @click="insertTag('{{Date}}')"
                        class="px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 rounded text-[10px] text-blue-300"
                      >
                        + {{Date}}
                      </button>
                      <button
                        @click="insertTag('{{ParentFolder}}')"
                        class="px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 rounded text-[10px] text-blue-300"
                      >
                        + {{ParentFolder}}
                      </button>
                      <button
                        @click="insertTag('{{Summary}}')"
                        class="px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 rounded text-[10px] text-blue-300"
                      >
                        + {{Summary}}
                      </button>
                      <button
                        @click="insertTag('{{Seq}}')"
                        class="px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 rounded text-[10px] text-blue-300"
                      >
                        + {{Seq}}
                      </button>
                    </div>
                  </div>

                  <div>
                    <label class="text-fluent-subtext block mb-1 font-medium"
                      >AIプロンプト指示:</label
                    >
                    <textarea
                      x-model="activeEditRule.prompt"
                      rows="3"
                      class="w-full bg-zinc-900 border border-fluent-border rounded px-2.5 py-1 text-white text-[11px]"
                    ></textarea>
                  </div>

                  <div
                    class="flex justify-between items-center pt-2 border-t border-fluent-border/60"
                  >
                    <button
                      @click="deleteActiveRule()"
                      :disabled="rules.length <= 1"
                      class="text-red-400 hover:text-red-300 disabled:opacity-20 text-[11px]"
                    >
                      このルールを削除
                    </button>
                    <button
                      @click="saveRules()"
                      class="px-4 py-1 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white"
                    >
                      設定を保存
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Execution Modal -->
      <div
        x-show="showProgressModal"
        x-transition
        class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50"
      >
        <div
          class="bg-fluent-surface border border-fluent-border rounded-xl p-5 max-w-md w-full shadow-2xl space-y-3 text-xs"
        >
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <span class="animate-spin text-blue-400">🔄</span>
            <span x-text="progressTitle"></span>
          </h3>
          <div
            class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden border border-zinc-700"
          >
            <div
              class="bg-blue-500 h-full transition-all duration-300"
              :style="'width: ' + progressPercent + '%'"
            ></div>
          </div>
          <p
            class="text-fluent-subtext font-mono text-[11px]"
            x-text="progressMessage"
          ></p>
          <div x-show="isExecutionComplete" class="pt-2 flex justify-end">
            <button
              @click="showProgressModal = false"
              class="px-4 py-1 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white"
            >
              閉じる
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Notification -->
      <div
        x-show="showToast"
        x-transition
        class="fixed bottom-6 right-6 bg-zinc-800 border border-fluent-border text-white text-xs px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2 z-50"
      >
        <span class="text-emerald-400 font-bold">✓</span>
        <span x-text="toastMessage"></span>
      </div>
    </div>

    <script>
      function companionApp() {
        return {
          dockerStatus: "unhealthy", // 'running', 'stopped', 'unhealthy'
          isDockerProcessing: false,
          isProcessing: false,
          layoutMode: "vertical", // 'vertical' (上下並び) or 'horizontal' (左右並び)
          filesLoaded: true,
          selectAll: true,
          showRuleManager: false,
          showProgressModal: false,
          progressTitle: "",
          progressPercent: 0,
          progressMessage: "",
          isExecutionComplete: false,
          showToast: false,
          toastMessage: "",
          undoAvailable: false,
          undoHistory: [],

          targetDir: "C:\\Users\\Public\\Videos\\Touring_2025_Summer",
          selectedModel: "meta-llama/llama-3.3-70b-instruct:free",
          selectedRuleId: "rule_1",

          rules: [
            {
              id: "rule_1",
              name: "[日付]_[要約(20文字以内)]",
              pattern: "{{Date}}_{{Summary}}",
              prompt:
                "動画の内容を表す簡潔なキーワードを英単語またはローマ字で20文字以内で抽出してください。",
            },
            {
              id: "rule_2",
              name: "[日付]_[親フォルダ名]_[通番]",
              pattern: "{{Date}}_{{ParentFolder}}_{{Seq}}",
              prompt:
                "親フォルダ名と撮影日時、連番を組み合わせて短い名前にしてください。",
            },
            {
              id: "rule_3",
              name: "[親フォルダ名]_[キーワード]",
              pattern: "{{ParentFolder}}_{{Summary}}",
              prompt:
                "フォルダ名を活かし、重要なシーンの単語を付与してください。",
            },
          ],
          activeEditRule: null,

          // Sample Data including regular files and an irregular file with AI Comments
          files: [
            {
              id: 1,
              selected: true,
              folderPath:
                "C:\\Users\\Public\\Videos\\Touring_2025_Summer\\Hokkaido_Cape_Soya_Super_Long_Folder_Path_Name_Over_Limit",
              beforeFileName:
                "VID_20250812_143022_Recorded_At_Wakkanai_Hokkaido_Very_Detailed_Description_Of_Riding_Motorcycle_Against_Strong_Wind.mp4",
              beforeLength: 251,
              afterFileName: "20250812_Hokkaido_Soya_Cape.mp4",
              afterLength: 124,
              isIrregular: false,
              aiComment:
                "元ファイル名の日付と地名「Wakkanai（稚内）」、シーン「Cape Soya」から規則通り要約命名しました。",
            },
            {
              id: 2,
              selected: true,
              folderPath:
                "C:\\Users\\Public\\Videos\\Touring_2025_Summer\\Hokkaido_Cape_Soya_Super_Long_Folder_Path_Name_Over_Limit",
              beforeFileName:
                "DSC_009988112233_Family_Camping_Barbecue_Party_Night_Campfire_Acoustic_Guitar_Session_Full_HD_High_Bitrate_Version.mp4",
              beforeLength: 247,
              afterFileName: "20250812_Family_Camp_BBQ.mp4",
              afterLength: 120,
              isIrregular: false,
              aiComment:
                "カメラ自動採番「DSC_0099...」から撮影日と「Camping Barbecue」を抽出し短縮命名しました。",
            },
            {
              id: 3,
              selected: true,
              folderPath:
                "C:\\Users\\Public\\Videos\\Touring_2025_Summer\\Furano_Lavender_Fields_Scenic_Route_Extremely_Detailed_Directory",
              beforeFileName:
                "7f9a2b8c_raw_camera_sensor_dump_stream_uuid_99887766554433221100_unprocessed_heavy_4k_footage_final.mp4",
              beforeLength: 249,
              afterFileName: "20250814_Furano_Lavender.mp4",
              afterLength: 119,
              isIrregular: true,
              aiComment:
                "元ファイル名に日付・内容の記載がなかったため、親フォルダ名「Furano」とファイル更新日時(2025/08/14)から補完命名しました。",
            },
          ],

          get selectedCount() {
            return this.files.filter((f) => f.selected).length;
          },

          init() {
            this.activeEditRule = this.rules[0];
          },

          toggleSelectAll() {
            this.files.forEach((f) => (f.selected = this.selectAll));
          },

          recalculateLength(file) {
            file.afterLength = (
              file.folderPath +
              "\\" +
              file.afterFileName
            ).length;
          },

          executeScanAndPropose() {
            this.isProcessing = true;
            this.notify("240文字以上の長パスファイルをスキャン中...");
            setTimeout(() => {
              this.filesLoaded = true;
              this.isProcessing = false;
              this.notify(
                "抽出完了: 3件の危険ファイルを検出し、AI新ファイル名を生成しました",
              );
            }, 800);
          },

          executeRename(withRestart) {
            this.isProcessing = true;
            this.showProgressModal = true;
            this.isExecutionComplete = false;
            this.progressTitle = "リネームを実行中...";
            this.progressPercent = 20;
            this.progressMessage =
              "重複チェックとファイルアクセス権限の検証...";

            this.undoHistory = this.files
              .filter((f) => f.selected)
              .map((f) => ({
                folderPath: f.folderPath,
                originalName: f.beforeFileName,
                renamedName: f.afterFileName,
              }));

            setTimeout(() => {
              this.progressPercent = 50;
              this.progressMessage = "物理ファイルのリネーム処理中 (3/3)...";
            }, 500);

            setTimeout(() => {
              if (withRestart) {
                this.progressPercent = 80;
                this.progressTitle = "Docker コンテナを再起動中...";
                this.progressMessage =
                  "docker compose restart tag-based-video-manager";
              } else {
                this.progressPercent = 100;
                this.progressMessage = "リネーム完了！";
                this.isExecutionComplete = true;
                this.isProcessing = false;
                this.undoAvailable = true;
              }
            }, 1200);

            if (withRestart) {
              setTimeout(() => {
                this.progressPercent = 100;
                this.progressMessage =
                  "全処理完了！マウント正常確認済 (Port 5620)";
                this.dockerStatus = "running";
                this.isExecutionComplete = true;
                this.isProcessing = false;
                this.undoAvailable = true;
                this.notify("リネーム完了 ＆ コンテナ正常起動しました");
              }, 2000);
            }
          },

          executeUndo() {
            if (
              !confirm(
                "直前のリネームを元に戻しますか？（元の長ファイル名に復元され、コンテナが再起動します）",
              )
            )
              return;

            this.isProcessing = true;
            this.showProgressModal = true;
            this.isExecutionComplete = false;
            this.progressTitle = "リネームの Undo (元に戻す) を実行中...";
            this.progressPercent = 30;
            this.progressMessage = "元のファイル名に逆リネーム中...";

            setTimeout(() => {
              this.progressPercent = 80;
              this.progressTitle = "Docker コンテナを再起動中...";
              this.progressMessage = "docker compose restart";
            }, 800);

            setTimeout(() => {
              this.progressPercent = 100;
              this.progressMessage = "元に戻す処理が完了しました！";
              this.dockerStatus = "unhealthy";
              this.isExecutionComplete = true;
              this.isProcessing = false;
              this.undoAvailable = false;
              this.notify("リネームを元に戻しました");
            }, 1600);
          },

          triggerDockerAction(action) {
            this.isDockerProcessing = true;
            setTimeout(() => {
              if (action === "up" || action === "restart") {
                this.dockerStatus = "running";
                this.notify("Dockerコンテナが起動しました (Port 5620)");
              } else if (action === "down") {
                this.dockerStatus = "stopped";
                this.notify("Dockerコンテナを停止しました");
              }
              this.isDockerProcessing = false;
            }, 600);
          },

          toggleDockerStatusSim() {
            if (this.dockerStatus === "running")
              this.dockerStatus = "unhealthy";
            else if (this.dockerStatus === "unhealthy")
              this.dockerStatus = "stopped";
            else this.dockerStatus = "running";
          },

          openRuleManager() {
            this.activeEditRule =
              this.rules.find((r) => r.id === this.selectedRuleId) ||
              this.rules[0];
            this.showRuleManager = true;
          },

          moveRule(idx, direction) {
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= this.rules.length) return;
            const temp = this.rules[idx];
            this.rules[idx] = this.rules[targetIdx];
            this.rules[targetIdx] = temp;
          },

          addNewRule() {
            const newRule = {
              id: "rule_" + Date.now(),
              name: "新しい命名規則",
              pattern: "{{Date}}_{{Summary}}",
              prompt: "簡潔なキーワードを抽出してください。",
            };
            this.rules.push(newRule);
            this.activeEditRule = newRule;
          },

          deleteActiveRule() {
            if (this.rules.length <= 1) return;
            this.rules = this.rules.filter(
              (r) => r.id !== this.activeEditRule.id,
            );
            this.activeEditRule = this.rules[0];
            this.selectedRuleId = this.rules[0].id;
          },

          insertTag(tag) {
            if (this.activeEditRule) {
              this.activeEditRule.pattern += "_" + tag;
            }
          },

          saveRules() {
            this.showRuleManager = false;
            this.notify("命名規則を保存しました (設定ファイルへ反映)");
          },

          notify(msg) {
            this.toastMessage = msg;
            this.showToast = true;
            setTimeout(() => {
              this.showToast = false;
            }, 3000);
          },
        };
      }
    </script>
  </body>
</html>
