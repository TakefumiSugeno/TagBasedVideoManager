<!doctype html>
<html lang="ja" class="h-full bg-zinc-950 text-zinc-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renamer UI Mockup - 日本語除外フィルタ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@400;600&family=Segoe+UI:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family:
          "Segoe UI",
          Meiryo UI,
          sans-serif;
      }
      .font-mono {
        font-family: "Cascadia Mono", Consolas, monospace;
      }
    </style>
  </head>
  <body class="h-full p-6 flex flex-col space-y-4" x-data="renamerMock()">
    <!-- ヘッダー情報 -->
    <div
      class="flex items-center justify-between border-b border-zinc-800 pb-3"
    >
      <div>
        <h1 class="text-lg font-bold text-zinc-100 flex items-center space-x-2">
          <span>TagBasedVideoManager.Renamer</span>
          <span
            class="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-normal"
            >UI Mockup</span
          >
        </h1>
        <p class="text-xs text-zinc-400">
          ファイル名日本語除外フィルタ機能のUIプレビュー
        </p>
      </div>
      <div class="text-xs text-zinc-500 font-mono">
        OpenSpec: renamer-filter-non-japanese
      </div>
    </div>

    <!-- Docker ステータスバー（リファレンス用） -->
    <div
      class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex items-center justify-between text-xs"
    >
      <div class="flex items-center space-x-3">
        <span class="text-zinc-400 font-semibold">🐳 Docker:</span>
        <span
          class="bg-emerald-950/40 text-emerald-400 border border-emerald-600/40 px-2.5 py-0.5 rounded-full font-bold"
          >● RUNNING (Port 5620)</span
        >
        <span class="text-zinc-500 font-mono">tag-based-video-manager</span>
      </div>
    </div>

    <!-- 設定・走査コントロールパネル（SECTION 2） -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 space-y-3">
      <!-- Row 1: 対象フォルダ & 抽出基準 -->
      <div class="flex flex-wrap items-center gap-4">
        <!-- フォルダ選択 -->
        <div class="flex items-center space-x-2">
          <span class="text-xs font-semibold text-zinc-400">対象フォルダ:</span>
          <input
            type="text"
            value="D:\Videos\Imports"
            readonly
            class="bg-zinc-950 border border-zinc-700 text-zinc-200 text-xs px-3 py-1.5 rounded w-56 font-mono"
          />
          <button
            class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3 py-1.5 rounded border border-zinc-700 transition"
          >
            参照...
          </button>
        </div>

        <!-- 抽出基準（パス長 ＆ 日本語除外フィルタ） -->
        <div
          class="bg-zinc-950 border border-zinc-800 rounded p-1.5 flex items-center space-x-3 text-xs"
        >
          <div class="flex items-center space-x-1.5">
            <span class="text-zinc-400 font-medium">抽出基準 (パス長):</span>
            <span class="text-rose-400 font-bold">≧</span>
            <input
              type="number"
              x-model.number="threshold"
              class="w-14 bg-black border border-zinc-700 text-center font-bold text-amber-300 rounded px-1 py-0.5 text-xs font-mono"
            />
            <span class="text-zinc-400">文字</span>
            <span class="text-zinc-600 text-[10px]">(※一時変更)</span>
          </div>

          <div class="h-4 w-px bg-zinc-800"></div>

          <!-- ★ 新規追加: 日本語除外チェックボックス ★ -->
          <label
            class="flex items-center space-x-2 cursor-pointer select-none text-zinc-300 hover:text-white"
          >
            <input
              type="checkbox"
              x-model="filterNonJapanese"
              class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-indigo-600 focus:ring-0"
            />
            <span class="text-xs font-medium"
              >ファイル名に日本語を含まないもののみ抽出</span
            >
          </label>

          <div class="h-4 w-px bg-zinc-800"></div>

          <!-- 該当件数 -->
          <span
            class="text-zinc-200 font-bold"
            x-text="`該当: ${filteredFiles.length} 件`"
          ></span>
        </div>
      </div>

      <!-- 区切り線 -->
      <div class="h-px bg-zinc-800"></div>

      <!-- Row 2: AIモデル, 命名規則 & 実行ボタン -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-4 text-xs">
          <div class="flex items-center space-x-2">
            <span class="text-zinc-400 font-semibold">AIモデル:</span>
            <select
              class="bg-zinc-950 border border-zinc-700 text-zinc-200 rounded px-2.5 py-1 text-xs"
            >
              <option>meta-llama/llama-3.3-70b-instruct:free</option>
            </select>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-zinc-400 font-semibold">命名規則:</span>
            <select
              class="bg-zinc-950 border border-zinc-700 text-zinc-200 rounded px-2.5 py-1 text-xs"
            >
              <option>標準タイトル命名規則</option>
            </select>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button
            class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-xs px-4 py-2 rounded shadow transition"
          >
            🔍 リネーム対象抽出＆AI提案を実行
          </button>
        </div>
      </div>
    </div>

    <!-- 抽出候補一覧プレビュー -->
    <div
      class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg p-4 flex flex-col space-y-3 overflow-hidden"
    >
      <div class="flex items-center justify-between text-xs text-zinc-400">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-zinc-200">抽出プレビュー</span>
          <span
            class="text-[10px] text-zinc-500"
            x-text="`（全 ${files.length} 件中、条件合致 ${filteredFiles.length} 件）`"
          ></span>
        </div>
        <div class="flex items-center space-x-2 text-[11px]">
          <span
            class="inline-block w-2.5 h-2.5 bg-rose-500/30 border border-rose-500 rounded-sm"
          ></span>
          <span class="text-zinc-400">日本語あり</span>
          <span
            class="inline-block w-2.5 h-2.5 bg-emerald-500/30 border border-emerald-500 rounded-sm ml-2"
          ></span>
          <span class="text-zinc-400">日本語なし (抽出対象)</span>
        </div>
      </div>

      <!-- リスト -->
      <div class="flex-1 overflow-y-auto space-y-2 pr-1">
        <template x-for="f in filteredFiles" :key="f.path">
          <div
            class="bg-zinc-950 border border-zinc-800 rounded p-2.5 text-xs font-mono flex items-center justify-between hover:border-zinc-700"
          >
            <div class="flex items-center space-x-3 min-w-0">
              <span
                class="px-2 py-0.5 rounded text-[10px] font-bold"
                :class="f.hasJapanese ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'"
                x-text="f.hasJapanese ? '日本語あり' : '英数のみ'"
              >
              </span>
              <div class="truncate">
                <span class="text-zinc-500" x-text="f.dir + '\\'"></span
                ><span
                  class="text-zinc-200 font-semibold"
                  x-text="f.name"
                ></span>
              </div>
            </div>
            <div
              class="flex items-center space-x-4 text-zinc-400 text-[11px] shrink-0"
            >
              <span
                x-text="`${f.path.length} 文字`"
                :class="f.path.length >= threshold ? 'text-amber-400 font-bold' : 'text-zinc-500'"
              ></span>
            </div>
          </div>
        </template>

        <template x-if="filteredFiles.length === 0">
          <div class="py-12 text-center text-zinc-500 text-xs">
            条件に合致する動画ファイルはありません。
          </div>
        </template>
      </div>
    </div>

    <script>
      function renamerMock() {
        return {
          threshold: 240,
          filterNonJapanese: false,
          files: [
            {
              dir: "D:\\Videos\\Anime",
              name: "SPY_FAMILY_Episode_01_1080p.mp4",
              path: "D:\\Videos\\Anime\\SPY_FAMILY_Episode_01_1080p.mp4",
              hasJapanese: false,
            },
            {
              dir: "D:\\Videos\\Anime",
              name: "鬼滅の刃_柱稽古編_第1話_完全版.mp4",
              path: "D:\\Videos\\Anime\\鬼滅の刃_柱稽古編_第1話_完全版.mp4",
              hasJapanese: true,
            },
            {
              dir: "D:\\Videos\\Raw",
              name: "20240915_VLOG_Tokyo_Trip_4K_60FPS_ProRes_Sample_Video_Raw_Footage_Extremely_Long_Path_Sample_Test_File_For_Length_Checking_Over_Threshold_Limit.mp4",
              path: "D:\\Videos\\Raw\\20240915_VLOG_Tokyo_Trip_4K_60FPS_ProRes_Sample_Video_Raw_Footage_Extremely_Long_Path_Sample_Test_File_For_Length_Checking_Over_Threshold_Limit.mp4",
              hasJapanese: false,
            },
            {
              dir: "D:\\Videos\\Raw",
              name: "20240915_東京旅行_VLOG_4K_高画質サンプル動画_パス長超過テスト用ファイル_日本語ファイル名検証用長大文字列_サンプルデータ.mp4",
              path: "D:\\Videos\\Raw\\20240915_東京旅行_VLOG_4K_高画質サンプル動画_パス長超過テスト用ファイル_日本語ファイル名検証用長大文字列_サンプルデータ.mp4",
              hasJapanese: true,
            },
            {
              dir: "D:\\Videos\\Overseas",
              name: "Nature_Documentary_Deep_Ocean_4K.mkv",
              path: "D:\\Videos\\Overseas\\Nature_Documentary_Deep_Ocean_4K.mkv",
              hasJapanese: false,
            },
            {
              dir: "D:\\Videos\\Overseas",
              name: "【映画】Interstellar_2014_Trailer.mp4",
              path: "D:\\Videos\\Overseas\\【映画】Interstellar_2014_Trailer.mp4",
              hasJapanese: true,
            },
          ],
          get filteredFiles() {
            return this.files.filter((f) => {
              const passLength = f.path.length >= this.threshold;
              if (this.filterNonJapanese) {
                return passLength && !f.hasJapanese;
              }
              return passLength;
            });
          },
        };
      }
    </script>
  </body>
</html>
