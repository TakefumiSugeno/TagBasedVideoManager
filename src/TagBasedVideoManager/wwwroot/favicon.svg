<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Background (Deep Slate with rounded corners) -->
  <rect width="512" height="512" rx="116" fill="#030712"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#312e81" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Brand Gradient Main Container -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="url(#primaryGrad)" filter="url(#dropShadow)"/>

  <!-- Glossy top reflection -->
  <rect x="36" y="36" width="440" height="220" rx="92" fill="url(#glossGrad)"/>

  <!-- Tag & Video Symbol Group -->
  <g transform="translate(0, 0)">
    <!-- Stylized Tag Silhouette Accent -->
    <path d="M 140 130 C 140 118.954 148.954 110 160 110 L 260 110 L 372 222 C 380 230 380 242 372 250 L 250 372 C 242 380 230 380 222 372 L 110 260 L 110 160 C 110 148.954 118.954 140 130 140 Z" 
          fill="#1e1b4b" fill-opacity="0.35"/>
    
    <!-- Tag Eyelet (hole) -->
    <circle cx="170" cy="170" r="26" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="170" cy="170" r="14" fill="#030712" fill-opacity="0.8"/>

    <!-- Prominent Play Triangle (Sharp & Centered) -->
    <path d="M 215 175 C 205 169 192 176 192 188 L 192 324 C 192 336 205 343 215 337 L 330 269 C 340 263 340 249 330 243 Z" 
          fill="#ffffff" filter="url(#dropShadow)"/>
  </g>
</svg>
